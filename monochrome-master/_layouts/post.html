---
layout: default
---
<article id="post-page">
  <header class="post-header">
    <h1>{% if page.header %}{{ page.header }}{% else %}{{ page.title }}{% endif %}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}" class="by-line">{{ page.date | date: "%b %-d, %Y" }}</time>
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>
