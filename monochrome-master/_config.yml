# Site settings
title: Max Mobley's Website
description: "Max Mobley | Software Engineer, Computer Engineer, Hobbyist Roboticist, and Maker"
url: "https://maxmob.sh"
author:
  name: "Max Mobley"
  email: "maxmob04@gmail.com"
  url: "https://maxmob.sh"

# Build settings
baseurl: / # Change this to your relative path (ex: /blog/), or leave just a /
markdown: kramdown
source: .
destination: ./_site
permalink: /:title
paginate: 8
paginate_path: /page:num/

# Default values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Plugins
gems:
  - jekyll-paginate
  - jekyll-sitemap

plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
version: "1.0.0"

# Options
custom_header: false
custom_nav_footer: false
reverse: false

# Color scheme: mist | classic | paper | ink (see _sass/themes.scss)
color_scheme: mist